name: CI

on:
  push:
    branches: [develop, main, 'release-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: mvn -B verify

  jitpack:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Ask JitPack to build this branch
        run: |
          url="https://jitpack.io/com/github/${{ github.repository }}/${{ github.ref_name }}-SNAPSHOT"
          curl -sS -m 600 -I "$url/mga-all-models-jars-${{ github.ref_name }}-SNAPSHOT.pom" || true
          curl -sSL -m 600 -o /dev/null -w "pom status after redirects %{http_code}\n" "$url/mga-all-models-jars-${{ github.ref_name }}-SNAPSHOT.pom" || true
          curl -sSL -m 120 "$url/build.log" | tail -80
