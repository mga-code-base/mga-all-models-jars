name: CI

on:
  push:
    branches: [develop, main, 'release-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build
        run: ./mvnw -B verify

  jitpack:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'
    steps:
      - name: Ask JitPack to build this commit and branch
        run: |
          base="https://jitpack.io/com/github/${{ github.repository }}"
          commit="${GITHUB_SHA::10}"
          curl -sSL -m 900 -o /dev/null -w "commit pom status %{http_code}\n" "$base/$commit/mga-all-models-jars-$commit.pom" || true
          curl -sSL -m 120 "$base/$commit/build.log" | tail -40
          curl -sSL -m 600 -o /dev/null -w "branch pom status %{http_code}\n" "$base/${{ github.ref_name }}-SNAPSHOT/mga-all-models-jars-${{ github.ref_name }}-SNAPSHOT.pom" || true
